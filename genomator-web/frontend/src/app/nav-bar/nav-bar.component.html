<!-- Navbar -->
<nav
  class="shadow-lg navbar navbar-expand-lg sticky-top"
  aria-label="Navigation bar"
>
  <div class="container-fluid">
    <a
      [routerLinkActiveOptions]="{ exact: true }"
      [routerLink]="['']"
      [routerLinkActive]="['active']"
      aria-label="Go to Home"
    >
      <img
        src="assets/L_Genomator_white.png"
        alt="genomator Web Service"
        class="genomator-image"
        href="/home"
      />
    </a>
    <!-- Visible Links -->
    <ul class="navbar-nav d-none d-lg-flex">
      <li>
        <a
          class="nav-link"
          [routerLinkActiveOptions]="{ exact: true }"
          [routerLink]="['']"
          [routerLinkActive]="['active']"
          #homeRla="routerLinkActive"
          [attr.aria-current]="homeRla.isActive ? 'page' : null"
          >Home</a
        >
      </li>
      <!-- <li><a class="nav-link" [routerLink]="['/tabular']" [routerLinkActive]="['active']">Generate Tabular Data</a></li> -->
      <li>
        <a
          class="nav-link"
          [routerLink]="['/genomic']"
          [routerLinkActive]="['active']"
          #genRla="routerLinkActive"
          [attr.aria-current]="genRla.isActive ? 'page' : null"
          aria-label="Generate genomic data"
          data-bs-toggle="tooltip"
          data-bs-title="Generate Genomic Data"
          data-bs-placement="bottom"
          >Generate</a
        >
      </li>
      <li>
        <a
          class="nav-link"
          href="https://bioinformatics.csiro.au/get-in-touch/"
          target="_blank"
          aria-label="Get Help (opens in new tab)"
          data-bs-toggle="tooltip"
          data-bs-title="Visit our contact page"
          data-bs-placement="bottom"
          >Get Help</a
        >
      </li>
    </ul>
    <!-- Toggler for Offcanvas Menu -->
    <button
      class="navbar-toggler bg-light"
      type="button"
      data-bs-toggle="offcanvas"
      data-bs-target="#navbarOffcanvas"
      aria-controls="navbarOffcanvas"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon bg-light" aria-hidden="true"></span>
    </button>
  </div>
</nav>

<!-- Offcanvas Menu -->
<div
  class="offcanvas offcanvas-start"
  tabindex="-1"
  id="navbarOffcanvas"
  aria-labelledby="navbarOffcanvasLabel"
  role="dialog"
  aria-modal="true"
>
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="navbarOffcanvasLabel">Genomator Menu</h5>
    <button
      type="button"
      class="btn-close btn-close-white text-reset"
      data-bs-dismiss="offcanvas"
      aria-label="Close"
    ></button>
  </div>
  <div class="offcanvas-body">
    <!-- Links in Offcanvas Menu -->
    <nav aria-label="Main navigation">
      <ul class="navbar-nav">
        <li>
          <a
            data-bs-dismiss="offcanvas"
            class="nav-link"
            [routerLinkActiveOptions]="{ exact: true }"
            [routerLink]="['']"
            [routerLinkActive]="['active']"
            #homeOffRla="routerLinkActive"
            [attr.aria-current]="homeOffRla.isActive ? 'page' : null"
            >Home</a
          >
        </li>
        <!-- <li>
          <a
            data-bs-dismiss="offcanvas"
            class="nav-link"
            [routerLink]="['/tabular']"
            [routerLinkActive]="['active']"
            >Generate Tabular Data</a
          >
        </li> -->
        <li>
          <a
            data-bs-dismiss="offcanvas"
            class="nav-link"
            [routerLink]="['/genomic']"
            [routerLinkActive]="['active']"
            #genOffRla="routerLinkActive"
            [attr.aria-current]="genOffRla.isActive ? 'page' : null"
            aria-label="Generate genomic data"
            data-bs-toggle="tooltip"
            data-bs-title="Generate Genomic Data"
            data-bs-placement="right"
            >Generate</a
          >
        </li>
        <li>
          <a
            class="nav-link"
            href="https://bioinformatics.csiro.au/get-in-touch/"
            target="_blank"
            aria-label="Get Help (opens in new tab)"
            data-bs-toggle="tooltip"
            data-bs-title="Visit our contact page"
            data-bs-placement="right"
            >Get Help</a
          >
        </li>
      </ul>
    </nav>
  </div>
</div>
